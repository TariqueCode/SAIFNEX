name: Go Node Runtime

on:
  push:
    branches: [main]
    paths:
      - "node/**"
      - ".github/workflows/node-runtime-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "node/**"
      - ".github/workflows/node-runtime-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test and build node runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: node/go.mod

      - name: Resolve module checksums
        run: go mod tidy

      - name: Test
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /tmp/saifnex-node ./cmd/saifnex-node
