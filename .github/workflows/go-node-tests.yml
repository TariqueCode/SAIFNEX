name: Go Node Runtime Tests

on:
  push:
    branches: [main]
    paths:
      - 'node/**'
      - '.github/workflows/go-node-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'node/**'
      - '.github/workflows/go-node-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: node/go.mod
      - name: Resolve module checksums
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/saifnex-node
